name: Daily Article Generation

on:
  schedule:
    - cron: '17 7 * * *'  # 7h17 UTC = 8h17 Paris / 9h17 Brazzaville
  workflow_dispatch: {}     # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r site-premium/content-engine/requirements.txt

      - name: Generate article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python site-premium/content-engine/generate.py

      - name: Commit and push
        run: |
          git config user.name "Almathe Content Engine"
          git config user.email "contact@almathe.net"
          git add -A site-premium/ressources/ site-premium/sitemap.xml site-premium/llms.txt site-premium/content-engine/topics.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "article: $(date +%Y-%m-%d) — nouvel article généré automatiquement"
            git push
          fi
